<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <link rel="stylesheet" href="../assets/css/bootstrap.min.css">
  <link rel="stylesheet" href="../assets/css/style.css?v=3">
  <title>All Games - Jan 'Bearlin' Malicki</title>
</head>

<body>
  <!-- Navigation -->
  <nav class="navbar navbar-expand-md fixed-top maine-menu">
    <div class="container">
      <button class="navbar-toggler ml-auto" data-target="#my-nav" onclick="myFunction(this)" data-toggle="collapse">
        <span class="bar1"></span> <span class="bar2"></span> <span class="bar3"></span>
      </button>
      <div id="my-nav" class="collapse navbar-collapse">
        <ul class="navbar-nav mx-auto">
          <li class="nav-item"> <a class="nav-link" href="../index.html">Home</a> </li>
          <li class="nav-item"> <a class="nav-link" href="portfolio.html">Portfolio</a></li>
          <li class="nav-item"> <a class="nav-link" href="contact.html">Contact</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- Banner -->
  <div class="container-fluid fh5co-home-banner portfolio-banner">
    <div class="card">
      <img class="card-img" src="../assets/img/banner-img.jpg" alt="">
      <div class="center-text header-title">
        <h2>All My Games</h2>
      </div>
    </div>
  </div>

  <!-- ALL GAMES -->
  <div class="container-fluid all-games-page">
    <div class="container">
      <h2 class="all-games-heading">
        <span class="all-games-accent"></span>
        Games I've worked on
      </h2>

      <!-- Cards are generated from assets/js/games.js (GAME_LISTS.allGames) -->
      <div class="row" data-game-list="allGames" data-card="all-games"></div>

      <div class="all-games-actions">
        <a href="portfolio.html" class="portfolio-button">Back to Portfolio</a>
        <a href="contact.html" class="portfolio-button">Contact Me</a>
      </div>
    </div>
  </div>

  <!-- Footer -->
  <footer class="container-fluid p-0 pr-0">
    <div class="copy pt-4 pb-4">
      <p>Jan Malicki | &nbsp; Website Template by <a href="https://freehtml5.co/" target="_blank">freehtml5.co</a> &nbsp;</p>
    </div>
  </footer>

  <!-- "What I did" pop-up -->
  <div class="modal fade case-study-modal" id="portfolioModal" tabindex="-1" role="dialog" aria-hidden="true">
    <div class="modal-dialog modal-lg" role="document">
      <div class="modal-content">
        <div class="modal-body case-study-body">
          <button type="button" class="close case-study-close" data-dismiss="modal" aria-label="Close">&times;</button>
          <div class="case-study-copy">
            <h2 id="modalTitle"></h2>
            <p id="modalCategory" class="case-study-category"></p>
          </div>
          <div id="modalMeta" class="case-study-meta case-study-meta-panel"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="../assets/js/jquery-3.3.1.slim.min.js"></script>
  <script src="../assets/js/popper.min.js"></script>
  <script src="../assets/js/bootstrap.min.js"></script>
  <script src="../assets/js/games.js?v=3"></script>
  <script src="../assets/js/main.js?v=3"></script>
</body>
</html>
